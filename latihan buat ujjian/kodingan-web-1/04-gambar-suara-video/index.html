<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Gambar, Suara, Video</title>
  <!-- Favicon: ikon kecil di tab browser -->
  <link rel="shortcut icon" href="gambar/foto.png">
</head>
<body>

<h2>Gambar</h2>
<img src="gambar/foto.png" width="300" alt="Contoh gambar" title="Ini tooltip" border="2">
<p>Gambar sebagai tautan:</p>
<a href="https://www.google.com"><img src="gambar/foto.png" width="150" alt="Klik aku"></a>

<h2>Suara (audio)</h2>
<audio controls>
  <source src="media/musik.mp3" type="audio/mp3">
  Browser tidak mendukung audio.
</audio>

<h2>Video</h2>
<video width="400" controls>
  <source src="media/video.mp4" type="video/mp4">
  Browser tidak mendukung video.
</video>

<p>Atribut lain: autoplay, loop, muted, poster (khusus video).</p>

</body>
</html>
