<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Iframe</title>
</head>
<body>

<h1>Contoh Iframe</h1>

<h3>1. Iframe dasar</h3>
<iframe src="isi1.html" width="400" height="150"></iframe>

<h3>2. Tanpa border, dengan scrolling</h3>
<iframe src="isi2.html" width="400" height="120" frameborder="0" scrolling="yes"></iframe>

<h3>3. Link yang membuka isi di dalam iframe (pakai name + target)</h3>
<a href="isi1.html" target="kotak">Halaman 1</a> |
<a href="isi2.html" target="kotak">Halaman 2</a><br><br>
<iframe src="isi1.html" name="kotak" width="400" height="150"></iframe>

</body>
</html>
