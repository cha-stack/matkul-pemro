<!--
  CARA KERJA WEB (client - server)
  1. Client (browser) mengetik alamat, misal http://contoh.com
  2. Browser mengirim REQUEST ke server memakai protokol HTTP
  3. Server mencari file HTML yang diminta
  4. Server mengirim RESPONSE berupa file HTML
  5. Browser menerjemahkan HTML menjadi tampilan
  Catatan: file ini kalau dibuka langsung dari komputer tidak lewat server,
  tapi struktur HTML-nya sama persis.
-->
<h1>Halo, Web!</h1>
<p>Ini halaman web pertamaku.</p>
<p>HTML = HyperText Markup Language (bahasa markup, bukan bahasa pemrograman).</p>
<p>Halaman web terhubung satu sama lain lewat <b>hyperlink</b>.</p>
