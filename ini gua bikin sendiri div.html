<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
        }
        .sidebar {
            float: left;
            width: 25%;
            background-color: #f1f1f1;
            padding: 10px;
            box-sizing: border-box;
            min-height: 200px;
        }
        .content {
            float: right;
            width: 75%;
            background-color: #e6f2ff;
            padding: 10px;
            box-sizing: border-box;
            min-height: 200px;
        }
        .footer {
            clear: both;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>My Website</h1>
    </div>
    <div class="sidebar">
        <h2>Sidebar</h2>
        <p>This is the sidebar content.</p>
    </div>
    <div class="content">
        <h2>Content</h2>
        <p>This is the main content area.</p>
    </div>
    <div class="footer">
        <p>&copy; 2023 My Website. All rights reserved.</p>
    </div>
</body>
</html>
