
<!DOCTYPE html>
<html>
<head>
    <title>Menu Navigasi</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #E8EFF8;
            font-family: Arial, sans-serif;
        }

        h3 {
            background-color: #52490f;
            color: white;
            padding: 12px;
            margin: 0 0 15px;
            border-radius: 6px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 12px;
        }

        a {
            display: block;
            padding: 12px;
            background-color: white;
            color: #52490f;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        a:hover {
            background-color: #52490f;
            color: white;
        }
    </style>
</head>
<body>
    <h3>MENU NAVIGASI</h3>

    </ul>
</body>
</html>
