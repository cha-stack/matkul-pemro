
<!DOCTYPE html>
<html>
<head>
    <title>Kontak</title>

        body {
            font-family: Arial, sans-serif;
            padding: 25px;
            color: #334155;
            background-color: #FFFFFF;
            line-height: 1.8;
        }

        h2 {
            color: #17365D;
            border-bottom: 3px solid #3478A8;

<body>
    <h2>Kontak Saya</h2>

    </div>
</body>
</html>
