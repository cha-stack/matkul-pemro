
<!DOCTYPE html>
<html>
<head>
    <title>Galeri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 25px;
            color: #334155;
            background-color: #FFFFFF;
            line-height: 1.8;
        }

        h2 {
            color: #17365D;
            border-bottom: 3px solid #3478A8;
            padding-bottom: 10px;
        }

        img {
            width: 180px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h2>Galeri Saya</h2>
    <p>Berikut adalah tempat untuk menampilkan foto kegiatan saya.</p>

    <img src="foto1.jpg" alt="Foto kegiatan 1">
    <img src="foto2.jpg" alt="Foto kegiatan 2">
</body>
</html>
