<html>
<head>
<title>Penggunaan Div Tag</title>

<style type="text/css">

body {
    margin: 20px;
    font-family: Arial, sans-serif;
}

div.header {
    border: 1px solid #000000;
    margin: 0.03em;
    background: #eeeeee;
    height: 100px;
    text-align: center;
}

div.header img {
    height: 100%;
    max-width: 100%;
    object-fit: cover;
}

div.sidebar {
    border: 1px solid #000000;
    margin: 0.03em;
    background: #f7f7f7;
    float: left;
    width: 38%;
    height: 180px;
    font-size: 2em;
    text-align: center;
    line-height: 180px;
}

div.content {
    border: 1px solid #000000;
    margin: 0.03em;
    background: #ffffff;
    float: right;
    width: 60%;
    height: 180px;
    font-size: 2em;
    text-align: center;
    line-height: 180px;
}

div.footer {
    border: 1px solid #000000;
    margin: 0.03em;
    background: #eeeeee;
    clear: both;
    height: 70px;
    font-size: 2em;
    text-align: center;
    line-height: 70px;
}

</style>
</head>

<body>

<div class="header">
    <img src="hijau.jpg" alt="Gambar Header">
</div>

<div class="sidebar">Sisi Kiri</div>

<div class="content">Isi Konten</div>

<div class="footer">Bawah</div>

</body>
</html>
